<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>筛选数组</title>
</head>

<body>
  <p>
    filter方法可以创建一个新数组，包含所有通过测试的元素。
  </p>
  <script>
    const numbers = [1, 2, 3, 4, 5, 6];
    const evenNumbers = numbers.filter(num => num % 2 === 0);
    console.log(evenNumbers); // [2, 4, 6]
  </script>
</body>

</html>
