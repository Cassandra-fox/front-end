<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定时轮播图</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .slider {
      width: 560px;
      height: 400px;
      margin: 160px auto;
      overflow: hidden;
    }

    .slider-wrapper {
      width: 100%;
      height: 320px;
    }

    .slider-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .slider-footer {
      height: 80px;
      background-color: rgb(65, 40, 85);
      padding: 12px 12px 0 12px;
      position: relative;
    }

    .slider-footer .toggle {
      position: absolute;
      right: 0;
      top: 12px;
      display: flex;
    }

    .slider-footer .toggle button {
      margin-right: 12px;
      width: 28px;
      height: 28px;
      appearance: none;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .slider-footer .toggle button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .slider-footer p {
      margin: 0;
      color: #fff;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .slider-indicator {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      align-items: center;
    }

    .slider-indicator li {
      width: 8px;
      height: 8px;
      margin: 4px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.4;
      cursor: pointer;
    }

    .slider-indicator li.active {
      width: 12px;
      height: 12px;
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="slider">
    <div class="slider-wrapper">
      <img src="./img/slider1.webp" alt="">
    </div>
    <div class="slider-footer">
      <p>叽里咕噜说什么呢换了</p>
      <ul class="slider-indicator">
        <li class="active"></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
      <div class="toggle">
        <button class="prev">&lt;</button>
        <button class="next">&gt;</button>
      </div>
    </div>
  </div>

  <!-- js -->
  <script>
    const sliderData = [
      { url: './img/slider1.webp', title: '叽里咕噜说什么呢反正这是第一张', color: 'rgb(100, 67, 68)' },
      { url: './img/slider2.webp', title: '叽里咕噜说什么呢反正这是第二张', color: 'rgb(67, 100, 68)' },
      { url: './img/slider3.webp', title: '叽里咕噜说什么呢反正这是第三张', color: 'rgb(83, 96, 112)' },
      { url: './img/slider4.webp', title: '叽里咕噜说什么呢反正这是第四张', color: 'rgb(56, 150, 146)' },
      { url: './img/slider5.webp', title: '叽里咕噜说什么呢反正这是第五张', color: 'rgb(84, 40, 32)' },
      { url: './img/slider6.webp', title: '叽里咕噜说什么呢反正这是第六张', color: 'rgb(58, 94, 66)' },
      { url: './img/slider7.webp', title: '叽里咕噜说什么呢反正这是第七张', color: 'rgb(81, 104, 171)' },
      { url: './img/slider8.webp', title: '叽里咕噜说什么呢反正这是第八张', color: 'rgb(34, 113, 118)' },
    ]

    const img = document.querySelector('.slider-wrapper img');
    const p = document.querySelector('.slider-footer p');
    // const li 
    //开定时器
    let i = 0//信号量
    setInterval(function () {
      i++
      if (i >= sliderData.length) {
        i = 0
      }
      img.src = sliderData[i].url
      p.innerText = sliderData[i].title
      document.querySelector('.slider-footer').style.backgroundColor = sliderData[i].color
      const lis = document.querySelector(`.slider-indicator li:nth-child(${i + 1})`)
      const actlis = document.querySelector('.slider-indicator li.active')//排杂(查？)
      actlis.classList.remove('active')//排杂(查？)
      lis.classList.add('active')
    }, 2000);

    //切换按钮
    const prev = document.querySelector('.prev')
    const next = document.querySelector('.next')
    prev.onclick = function () {
      i--
      if (i < 0) {
        i = sliderData.length - 1
      }
      img.src = sliderData[i].url
      p.innerText = sliderData[i].title
      document.querySelector('.slider-footer').style.backgroundColor = sliderData[i].color
      const lis = document.querySelector(`.slider-indicator li:nth-child(${i + 1})`)
      const actlis = document.querySelector('.slider-indicator li.active')//排杂(查？)
      actlis.classList.remove('active')//排杂(查？)
      lis.classList.add('active')
    }

    next.onclick = function () {
      i++
      if (i >= sliderData.length) {
        i = 0
      }
      img.src = sliderData[i].url
      p.innerText = sliderData[i].title
      document.querySelector('.slider-footer').style.backgroundColor = sliderData[i].color
      const lis = document.querySelector(`.slider-indicator li:nth-child(${i + 1})`)
      const actlis = document.querySelector('.slider-indicator li.active')//排杂(查？)
      actlis.classList.remove('active')//排杂(查？)
      lis.classList.add('active')
    }






  </script>
</body>

</html>
