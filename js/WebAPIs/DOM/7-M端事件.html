<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移动端事件</title>
</head>

<body>
  <h1>移动端事件</h1>
  <p>
    触屏事件touch,ios和安卓都支持<br>
    touchstart:手指触摸到一个DOM元素时触发<br>
    touchmove:手指在一个DOM元素上移动时触发<br>
    touchend:手指从一个DOM元素上移开时触发<br>
    touchcancel:手指在一个DOM元素上滑动时，系统取消触摸
  </p>





</body>

</html>
