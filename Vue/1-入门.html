<body>
  <h1>Vue</h1>
  <p>
    一套用于构建用户界面的渐进式框架。<br>
    渐进式：可以自底向上逐层的应用，只需一个轻量核心库，引入其他功能时按需引入。<br>
    Evan You（尤雨溪）在2014年正式发布。<br>
  </p>
  <p>
    组件化模式，提高开发效率和代码复用性。<br>
    xxx.vue =html+css+js<br>
    声明式编码，编码人员无需直接操作DOM，提高开发效率。<br>
    纯js是命令式编码。<br>
    使用虚拟DOM和优秀的diff算法，提高性能。<br>
  </p>
