<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用state响应输入</title>
</head>
<body>
  <h1>用state响应输入</h1>
  <p>
    React 控制 UI 的方式是声明式的。你不必直接控制 UI 的各个部分，只需要声明组件可以处于的不同状态，并根据用户的输入在它们之间切换。这与设计师对 UI 的思考方式很相似。
  </p>

  <ul>
    <li>声明式编程意味着为每个视图状态声明 UI 而非细致地控制 UI（命令式）。</li>
    <li>
      当开发一个组件时：
      <ol>
        <li>写出你的组件中所有的视图状态。</li>
        <li>确定是什么触发了这些 state 的改变。</li>
        <li>通过 useState 模块化内存中的 state。</li>
        <li>删除任何不必要的 state 变量。</li>
        <li>连接事件处理函数去设置 state。</li>
      </ol>
    </li>
  </ul>
















  
</body>
</html>
