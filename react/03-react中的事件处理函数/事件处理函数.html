<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>react中的事件处理函数</title>
</head>

<body>
  <h1>react中的事件处理函数</h1>
  <div class="button1"></div>
  <br>
  <div class="login"></div>
  <br>
  <div class="login1"></div>









  <!-- 引入react核心库 -->
  <script src="../../lib/react/react.development.js"></script>
  <!-- 引入react-dom,用于操作DOM -->
  <script src="../../lib/react/react-dom.development.js"></script>
  <!-- 引入babel,用于将JSX语法转为js -->
  <script src="../../lib/react/babel.min.js"></script>
  <!-- 引入prop-types,用于类型检查 -->
  <script src="../../lib/react/prop-types.js"></script>
  <script type="text/babel">
    //组件1
    class Say extends React.Component {
      //事件委托
      show = () => {
        alert('hello,react事件处理函数')
      }
      //不用ref
      show1 = () => {
        alert(event.target.value)
      }

      render() {
        return (
          <div>
            <button onClick={this.show}>点我</button>
            <input onBlur={this.show1} type="text" />
          </div>
        )
      }
    }
    ReactDOM.render(<Say />, document.querySelector('.button1'))

    //组件2
    //非受控组件
    class Login extends React.Component {
      handleSubmit = (event) => {
        event.preventDefault()//阻止表单的默认提交行为
        //现用现取叫非受控组件
        const { username, password } = this
        alert(`用户名:${username.value},密码:${password.value}`)
      }
      render() {
        return (
          <div>
            <form onSubmit={this.handleSubmit} action="">
              <input ref={c => { this.username = c }} type="text" name="username" placeholder="用户名" />
              <input ref={c => { this.password = c }} type="password" name="password" placeholder="密码" />
              <button>登录</button>
            </form>
          </div>
        )
      }
    }
    ReactDOM.render(<Login />, document.querySelector('.login'))

    //受控组件
    class Login1 extends React.Component {
      state = {
        username: '',
        password: ''
      }
      //高阶函数-函数柯里化
      saveInfo = (infoType) => {
        return (event) => {
          const { value } = event.target
          this.setState({
            [infoType]: value
          })
        }
      }
      //原版：频繁重渲染且输入很多时，原版会稍省一点分配和比较成本。
      /*
      saveInfo = (event) => {
        const { name, value } = event.target
        this.setState({
          [name]: value
        })
      }
      */
      handleSubmit = (event) => {
        event.preventDefault()//阻止表单的默认提交行为
        const { username, password } = this.state
        alert(`用户名:${username},密码:${password}`)
      }
      render() {
        const { username, password } = this.state
        return (
          <div>
            <form onSubmit={this.handleSubmit} action="">
              <input value={username} onChange={this.saveInfo('username')} type="text" name="username" placeholder="用户名" />
              <input value={password} onChange={this.saveInfo('password')} type="password" name="password" placeholder="密码" />
              <button>登录</button>
            </form>
          </div>
        )
      }
    }
    ReactDOM.render(<Login1 />, document.querySelector('.login1'))

    //对象相关的知识
    //[key名]会解析为key名对应的值

    //高阶函数定义：
    /*
    1.函数接收的参数是函数
    2.函数的返回值是函数
    常见的高阶函数：bind、call、apply、setTimeout、setInterval、Promise.then/catch/finally、数组的forEach、map、filter、reduce等
    3.函数柯里化：将一个多参数的函数，转换成一个单参数的函数，并且返回一个函数，以此类推，直到所有参数都传完，才执行函数体
    */

    function add(x) {
      return function (y) {
        return function (z) {
          return x + y + z
        }
      }
    }

    const add3 = add(3)
    const add3and4 = add3(4)
    console.log(add3and4(5))
    console.log(add3and4(6))
    console.log(add(3)(4)(5))





  </script>
</body>

</html>
